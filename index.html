<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class = "encabezado">
       
        <section class="Usuario"> <!--foto de usuario a la derecha, a la misma altura  un saludo de bienvenida y el nombre-->
            <h2>Vienvenido, Welcome!!</h2>
            <h1>Mario Villatoro</h1>  
            <img src="#" alt="Foto de usuario">
        </section>

        <nav class = "barraNavegacion"> <!--menu movil con las opciones de inicio, carrito de compras favortitos y usuario, dependiendo de la plataforma se debe modificar y adecuar al tamaño -->
            <ul class = "menu"> 
                <li><img src="./storage/img/Barra_navegacion/casa.png" alt ="Home" width="20px" >Home</li>
                <li><img src="./storage/img/Barra_navegacion/bolsa-de-la-compra.png" alt="Carrito" width="20px">Carrito</li>
                <li><img src="./storage/img/Barra_navegacion/corazon.png" alt="Carrito" width="20px">Favoritos</li>
                <li><img src="./storage/img/Barra_navegacion/usuario.png" alt="Carrito" width="20px">Mi perfil</li>
            </ul>
        </nav>

        <section class="search"> <!--Barra de busqueda, -->
            <form class="form">
                <input type="search" name="q" placeholder = "Search clothes">
                <button>Search</button>
            </form>
        </section>

    </header>

    <main>

        <section class="categorias"><!--tarjetas de producttos, incluye un icono-->
            <ul>
                <li><button><img src="./storage/img/Categorias/boton-de-cuatro-cuadrados-redondeados.png" alt="Todos los productos" width="20px">Todos los productos</button></li>
                <li><button><img src="./storage/img/Categorias/zapatillas.png" alt="Zapatos" width="20px">Zapatos</button></li>
                <li><button><img src="./storage/img/Categorias/futbol.png" alt="Todos los productos" width="20px">Camisas</button></li>
                <li><button><img src="./storage/img/Categorias/pantalones-rasgados.png" alt="Todos los productos" width="20px">Pantalones</button></li>
            </ul>
        </section>

        <section class="boton"></section>

        <!--Boton de favoritos, debe tener interaccion-->

        <section class="productos">
            <div class="tarjetas"></div>
            <!--debe mostrar el produco, imagen, boton de añadir a favoritos
            titulo, categoria, precio y calificacion-->

        </section>

    </main>
    <footer class="footer">

    </footer>
</body>
</html>
